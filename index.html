<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#789987"><title>代謝紀錄器</title><style>:root{--g:#789987;--bg:#f7f5ef;--ink:#24352d;--mut:#738078;--card:#fff;--line:#dbe3de}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--ink)}main{max-width:720px;margin:auto;padding:20px 16px 60px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:3}.tab{border:0;border-radius:18px;padding:15px 6px;font-size:18px;font-weight:700;background:#e9ece7;color:var(--ink)}.tab.on{background:var(--g);color:white}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:14px;box-shadow:0 2px 8px #00000008}h1{font-size:25px;margin:0 0 20px}label{display:block;font-weight:700;color:var(--mut);margin:17px 0 8px}input,select,textarea{width:100%;font:inherit;font-size:18px;border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff;color:var(--ink)}textarea{min-height:90px}.range{display:grid;grid-template-columns:1fr 42px;gap:12px;align-items:center}.range input{padding:0}.score{text-align:center;font-size:21px;font-weight:800}.btn{width:100%;border:0;border-radius:18px;background:var(--g);color:#fff;padding:17px;font-size:20px;font-weight:800;margin-top:22px}.hint,.saved{padding:13px 15px;border-radius:15px;margin-top:14px;background:#f0f3f0;color:var(--mut)}.saved{display:none;color:#466453;font-weight:700}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.checks label{margin:0;background:#f3f5f2;border-radius:14px;padding:12px;color:var(--ink);font-weight:600}.checks input{width:auto;margin-right:6px}.hide{display:none}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f1f4f1;border-radius:16px;padding:15px}.stat b{display:block;font-size:22px;margin-top:5px}.summary{white-space:pre-wrap;background:#f3f5f2;padding:15px;border-radius:16px;line-height:1.65}</style></head><body><main><div class="tabs"><button class="tab on" data-p="am">☀️ 早上</button><button class="tab" data-p="pm">🌙 晚上</button><button class="tab" data-p="sum">📊 摘要</button></div><section id="am" class="panel"><div class="card"><h1>早晨 Check-in</h1><label>日期</label><input id="date" type="date"><label>體重（kg）</label><input id="weight" type="number" step="0.1" inputmode="decimal"><label>HRV（ms）</label><input id="hrv" type="number" inputmode="numeric"><label>睡眠時間（小時）</label><input id="sleep" type="number" step="0.1" inputmode="decimal"><label>睡眠品質 0–10</label><div class="range"><input id="sleepQ" type="range" min="0" max="10" value="5"><span id="sleepQv" class="score">5</span></div><label>起床精神 0–10</label><div class="range"><input id="energy" type="range" min="0" max="10" value="5"><span id="energyv" class="score">5</span></div><label>起床飢餓 0–10</label><div class="range"><input id="hungryAM" type="range" min="0" max="10" value="3"><span id="hungryAMv" class="score">3</span></div><button class="btn" id="saveAM">完成早晨紀錄</button><div id="savedAM" class="saved">✓ 早晨紀錄已儲存</div></div></section><section id="pm" class="panel hide"><div class="card"><h1>晚間 Check-in</h1><label>今日估計總熱量（kcal）</label><input id="cal" type="number" inputmode="numeric"><label>今日步數</label><input id="steps" type="number" inputmode="numeric"><label>早餐類型</label><select id="breakfast"><option value="">請選擇</option><option>半份健康餐盒</option><option>粉漿蛋餅＋2顆蛋</option><option>鮪魚御飯糰＋茶葉蛋</option><option>其他</option></select><label>午餐前飢餓 0–10</label><div class="range"><input id="preLunch" type="range" min="0" max="10" value="3"><span id="preLunchv" class="score">3</span></div><label>下午嘴饞／想吃甜 0–10</label><div class="range"><input id="craving" type="range" min="0" max="10" value="3"><span id="cravingv" class="score">3</span></div><label>晚餐前飢餓 0–10</label><div class="range"><input id="preDinner" type="range" min="0" max="10" value="3"><span id="preDinnerv" class="score">3</span></div><label>晚上嘴饞 0–10</label><div class="range"><input id="nightCrave" type="range" min="0" max="10" value="3"><span id="nightCravev" class="score">3</span></div><label>餐後水果</label><div class="checks"><label><input id="fruitAM" type="checkbox">早餐後</label><label><input id="fruitLunch" type="checkbox">午餐後</label></div><label>水煮蛋加餐（顆）</label><select id="eggs"><option>0</option><option>1</option><option>2</option><option>3</option></select><label>額外零食／甜點</label><input id="snack" placeholder="無，或簡短寫內容"><label>身體感受</label><div class="checks" id="feel"><label><input type="checkbox" value="輕盈">輕盈</label><label><input type="checkbox" value="疲累">疲累</label><label><input type="checkbox" value="頭暈">頭暈</label><label><input type="checkbox" value="冒冷汗">冒冷汗</label><label><input type="checkbox" value="胃脹">胃脹</label><label><input type="checkbox" value="GERD">GERD</label></div><label>CGM 特殊狀況</label><textarea id="cgm" placeholder="沒有可留白"></textarea><button class="btn" id="savePM">完成今日紀錄</button><div id="savedPM" class="saved">✓ 晚間紀錄已儲存</div></div></section><section id="sum" class="panel hide"><div class="card"><h1>最近 7 天</h1><div class="stats"><div class="stat">平均體重<b id="sW">—</b></div><div class="stat">平均熱量<b id="sC">—</b></div><div class="stat">平均步數<b id="sS">—</b></div><div class="stat">平均 HRV<b id="sH">—</b></div><div class="stat">下午嘴饞<b id="sCr">—</b></div><div class="stat">紀錄天數<b id="sD">0</b></div></div><div id="sumText" class="summary" style="margin-top:16px">尚無紀錄</div><button class="btn" id="copy">複製最近 7 天摘要</button><button class="btn" id="backup" style="background:#69766f">下載資料備份</button><div class="hint">資料只儲存在目前這個瀏覽器。換手機、清除 Safari 網站資料或使用其他瀏覽器時，不會自動帶過去。</div></div></section></main><script>const K='metabolicTrackerV2';const $=id=>document.getElementById(id);let data=JSON.parse(localStorage.getItem(K)||'{}');const today=()=>{let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)};$('date').value=today();function ranges(){document.querySelectorAll('input[type=range]').forEach(r=>{let v=$(r.id+'v');let f=()=>v.textContent=r.value;r.addEventListener('input',f);r.addEventListener('change',f);f()})}ranges();function current(){return $('date').value||today()}function persist(){localStorage.setItem(K,JSON.stringify(data))}function load(){let d=data[current()]||{};['weight','hrv','sleep','sleepQ','energy','hungryAM','cal','steps','breakfast','preLunch','craving','preDinner','nightCrave','eggs','snack','cgm'].forEach(k=>{if(d[k]!==undefined&&$(k))$(k).value=d[k]});['fruitAM','fruitLunch'].forEach(k=>$(k).checked=!!d[k]);document.querySelectorAll('#feel input').forEach(x=>x.checked=(d.feel||[]).includes(x.value));ranges()}function amObj(){return{weight:$('weight').value,hrv:$('hrv').value,sleep:$('sleep').value,sleepQ:$('sleepQ').value,energy:$('energy').value,hungryAM:$('hungryAM').value}}function pmObj(){return{cal:$('cal').value,steps:$('steps').value,breakfast:$('breakfast').value,preLunch:$('preLunch').value,craving:$('craving').value,preDinner:$('preDinner').value,nightCrave:$('nightCrave').value,fruitAM:$('fruitAM').checked,fruitLunch:$('fruitLunch').checked,eggs:$('eggs').value,snack:$('snack').value,cgm:$('cgm').value,feel:[...document.querySelectorAll('#feel input:checked')].map(x=>x.value)}}function save(obj,msg){let k=current();data[k]={...(data[k]||{}),...obj};persist();$(msg).style.display='block';setTimeout(()=>$(msg).style.display='none',2200);render()}$('saveAM').onclick=()=>save(amObj(),'savedAM');$('savePM').onclick=()=>save(pmObj(),'savedPM');$('date').onchange=load;document.querySelectorAll('input,select,textarea').forEach(x=>x.addEventListener('change',()=>{let k=current();data[k]={...(data[k]||{}),...(x.closest('#am')?amObj():x.closest('#pm')?pmObj():{})};persist()}));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.panel').forEach(x=>x.classList.add('hide'));$(b.dataset.p).classList.remove('hide');if(b.dataset.p==='sum')render()});const avg=(a,k)=>{let x=a.map(d=>+d[1][k]).filter(Number.isFinite).filter(v=>v!==0);return x.length?x.reduce((p,c)=>p+c,0)/x.length:null};function recent(){return Object.entries(data).sort((a,b)=>a[0].localeCompare(b[0])).slice(-7)}function render(){let a=recent(),w=avg(a,'weight'),c=avg(a,'cal'),s=avg(a,'steps'),h=avg(a,'hrv'),cr=avg(a,'craving');$('sW').textContent=w?w.toFixed(1)+' kg':'—';$('sC').textContent=c?Math.round(c)+' kcal':'—';$('sS').textContent=s?Math.round(s).toLocaleString():'—';$('sH').textContent=h?Math.round(h)+' ms':'—';$('sCr').textContent=cr?cr.toFixed(1)+'/10':'—';$('sD').textContent=a.length;let t=a.map(([dt,d])=>`${dt}｜體重 ${d.weight||'—'}｜熱量 ${d.cal||'—'}｜步數 ${d.steps||'—'}｜HRV ${d.hrv||'—'}｜下午嘴饞 ${d.craving??'—'}｜早餐 ${d.breakfast||'—'}`).join('\n');$('sumText').textContent=t||'尚無紀錄'}$('copy').onclick=async()=>{let t=$('sumText').textContent;try{await navigator.clipboard.writeText(t);$('copy').textContent='✓ 已複製';setTimeout(()=>$('copy').textContent='複製最近 7 天摘要',1500)}catch(e){alert('瀏覽器未允許自動複製，請長按摘要文字複製。')}};$('backup').onclick=()=>{let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='metabolic-tracker-backup-'+today()+'.json';a.click();URL.revokeObjectURL(u)};load();render()</script></body></html>
